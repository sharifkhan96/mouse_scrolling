name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests cover the logic only; camera, MediaPipe, audio and GUI are not needed.
      - run: pip install numpy==1.26.4
      - run: python -m unittest discover -s tests -v
